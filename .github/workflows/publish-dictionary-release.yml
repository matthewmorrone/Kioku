name: Publish Dictionary Release

# Closes the exact gap that shipped in 065090a and again while fixing the ranking-drift bug in
# PR #49: dictionary.sqlite is rebuilt locally, DictionaryDownloadManager's releaseTag/
# expectedSHA256 are bumped in source, but nobody actually publishes the matching GitHub Release
# — so every install (old and fresh) either stays stuck on stale data or 404s outright. This
# workflow makes "code says releaseTag=X" and "release X exists on GitHub with the pinned bytes"
# the same fact, checked and repaired automatically instead of relying on a human to remember a
# manual step days or weeks after the code change that required it.
#
# Runs only on pushes to main (never on pull_request — an untrusted fork PR must not be able to
# trigger a release publish) that touch the committed dictionary archive or the pin itself, plus
# workflow_dispatch for an on-demand re-check.
on:
  push:
    branches: [ main ]
    paths:
      - 'Resources/dictionary.sqlite.zst.part-*'
      - 'Kioku/Dictionary/DictionaryDownloadManager.swift'
  workflow_dispatch: {}

permissions:
  contents: write

# A second push landing mid-publish must not race the first — both would see "no release yet"
# and both attempt to create the same tag. Queue instead of running concurrently; never cancel a
# publish that's already uploading.
concurrency:
  group: publish-dictionary-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install zstd
        run: sudo apt-get update && sudo apt-get install -y zstd

      # Reassembles Resources/dictionary.sqlite from the committed, split zstd archive — the same
      # bytes CI/tests build against (see scripts/ensure_dictionary.sh's own comment for why it's
      # split). This is deliberately the ONLY input: if the committed chunks don't reconstruct to
      # what the pin claims, that's caught below rather than trusted.
      - name: Decompress dictionary.sqlite
        run: bash scripts/ensure_dictionary.sh

      # Single source of truth for what to publish: DictionaryDownloadManager.swift's own pin,
      # not a separately-tracked version number that could itself drift from the code.
      - name: Read releaseTag/expectedSHA256 from DictionaryDownloadManager.swift
        id: pin
        run: |
          set -euo pipefail
          RELEASE_TAG=$(python3 -c "
          import re
          text = open('Kioku/Dictionary/DictionaryDownloadManager.swift').read()
          m = re.search(r'releaseTag = \"([^\"]+)\"', text)
          print(m.group(1) if m else '')
          ")
          EXPECTED_SHA256=$(python3 -c "
          import re
          text = open('Kioku/Dictionary/DictionaryDownloadManager.swift').read()
          m = re.search(r'expectedSHA256 = \"([^\"]+)\"', text)
          print(m.group(1) if m else '')
          ")
          if [[ -z "$RELEASE_TAG" || -z "$EXPECTED_SHA256" ]]; then
            echo "::error::Could not parse releaseTag/expectedSHA256 out of DictionaryDownloadManager.swift — has its source shape changed?"
            exit 1
          fi
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "expected_sha256=$EXPECTED_SHA256" >> "$GITHUB_OUTPUT"
          echo "Pinned to $RELEASE_TAG / $EXPECTED_SHA256"

      # Guards against publishing the wrong bytes under the right tag: if the committed archive
      # doesn't reconstruct to the hash the app expects, something is inconsistent (stale chunks,
      # a hand-edited pin, a bad regeneration) and must be fixed before anything is released, not
      # papered over by uploading whatever happened to be lying around.
      - name: Verify local dictionary.sqlite matches the pin
        run: |
          set -euo pipefail
          ACTUAL_SHA256=$(sha256sum Resources/dictionary.sqlite | awk '{print $1}')
          if [[ "$ACTUAL_SHA256" != "${{ steps.pin.outputs.expected_sha256 }}" ]]; then
            echo "::error::Resources/dictionary.sqlite (rebuilt from committed .zst.part-* chunks) has sha256 $ACTUAL_SHA256, but DictionaryDownloadManager.expectedSHA256 says ${{ steps.pin.outputs.expected_sha256 }}. Regenerate the chunks or fix the pin before this can publish anything."
            exit 1
          fi
          echo "OK: local dictionary.sqlite matches the pin."

      # Tags are treated as immutable once published (see DictionaryDownloadManager's own comment:
      # "Pinned to a specific release tag, not a moving tag") — a mismatch here means the tag was
      # reused for different content, which every installed app's cached checksum assumption
      # depends on never happening. Fail loud rather than silently leaving stale/wrong bytes live.
      #
      # Uses the raw REST endpoint (not `gh release view --json`) because it exposes each asset's
      # `digest` field — GitHub's own sha256 of the uploaded bytes — so this compares the actual
      # pinned hash exactly, without downloading the ~350MB asset just to verify it.
      - name: Check whether the release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.pin.outputs.release_tag }}
          EXPECTED_SHA256: ${{ steps.pin.outputs.expected_sha256 }}
        run: |
          set -euo pipefail
          if ! gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > /tmp/release.json 2>/dev/null; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No release found at tag $RELEASE_TAG — will publish."
            exit 0
          fi
          echo "exists=true" >> "$GITHUB_OUTPUT"
          PUBLISHED_DIGEST=$(python3 -c "
          import json
          data = json.load(open('/tmp/release.json'))
          matches = [a.get('digest') for a in data['assets'] if a['name'] == 'dictionary.sqlite']
          print(matches[0] if matches else '')
          ")
          if [[ "$PUBLISHED_DIGEST" != "sha256:$EXPECTED_SHA256" ]]; then
            echo "::error::Release $RELEASE_TAG already exists but its dictionary.sqlite asset digest ($PUBLISHED_DIGEST) doesn't match the pinned hash (sha256:$EXPECTED_SHA256). Release tags must never be reused for different content — bump releaseTag to a new tag instead."
            exit 1
          fi
          echo "Release $RELEASE_TAG already exists and its asset digest matches — nothing to publish."

      - name: Publish release
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.pin.outputs.release_tag }}
          EXPECTED_SHA256: ${{ steps.pin.outputs.expected_sha256 }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" Resources/dictionary.sqlite \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TAG" \
            --notes "Automated publish by .github/workflows/publish-dictionary-release.yml from commit $GITHUB_SHA. sha256: $EXPECTED_SHA256"
          echo "Published $RELEASE_TAG."
