name: Tests

# Manual only (workflow_dispatch) — for changes to stores, backup / restore, alignment and the
# other areas the suite covers. Segmentation is checked locally instead, in seconds:
# scripts/segmentation-eval (held2k / lyrics numbers and named_cases.py).
on:
  workflow_dispatch:

# A newer push to the same PR makes the older run pointless, so cancel the superseded one.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    # macos-26 (preview) ships iOS 26.5 simulator runtimes; macos-15 caps at
    # iOS 26.2, where ~18 of our tests SIGABRT during process bootstrap.
    # Locally on iOS 26.5 (where developers run) those same tests pass cleanly,
    # so matching CI to the local runtime eliminates the cluster of
    # environmental crashes without skip-listing real test coverage.
    runs-on: macos-26
    # A run past 30 minutes is a hang, not a slow build.
    timeout-minutes: 30
    steps:
      # Submodules now use public HTTPS URLs directly (.gitmodules), so no deploy key
      # is needed. This SSH→HTTPS rewrite is a harmless safety net for any stray SSH URL
      # (e.g. a locally-inited checkout). If a submodule fork is ever made private,
      # a PAT with repo scope must be provisioned here — GITHUB_TOKEN can't read another repo.
      - name: Rewrite any SSH submodule URLs to HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      # The restored DerivedData can only be reused if unchanged sources look unchanged to the
      # build system. A checkout gives every file a new mtime and inode, which on its own made the
      # PR run recompile all of Kioku plus the local packages (zinnia-swift,
      # SwiftWhisperAlign). The script stamps each tracked file with an mtime derived from its
      # content hash, and the default makes XCBuild ignore inode/device changes. warm-cache.yml
      # and tests.yml must both do this, so the stamps match.
      - name: Pin source mtimes
        run: |
          python3 scripts/ci_pin_source_mtimes.py .
          defaults write com.apple.dt.XCBuild IgnoreFileSystemDeviceInodeChanges -bool YES

      # The project targets iOS 26.2 / Xcode 26+. The runner image carries
      # several Xcode versions side-by-side; pick the newest stable so the
      # symbol SVG asset compiler matches the source format.
      - name: Show installed Xcode versions
        run: ls /Applications | grep -i '^Xcode' || true

      # Pin to 26.5 rather than latest-stable: on macos-26, latest-stable resolves
      # to an RC, and the DerivedData cache key below names the Xcode version.
      - name: Select Xcode 26.5
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      # Don't pre-boot the simulator in an earlier step: booting alongside the cache restore and
      # build stretches the boot to ~8 min on these runners (vs ~2.5 min booted by xcodebuild
      # after the build), so it made runs slower (runs 35959658405, 35979275850).
      - name: List available iOS simulators
        run: xcrun simctl list devices available | grep -E 'iPhone (15|16|17)' | head -10

      # Restores the DerivedData (resolved package checkouts + already-compiled package products)
      # that warm-cache.yml saves from main, so a PR only compiles what it changed instead of the
      # packages (mecab, dagre-swift, zinnia-swift, SwiftWhisperAlign) and the unchanged app
      # sources. Restore-only: a cache saved from a PR ref is readable by that PR alone, so
      # saving here just piled up ~1.1 GB per PR that no other run could use. The key is the
      # Package.resolved hash, the same key warm-cache.yml writes; restore-keys falls back to the
      # newest older cache after a dependency bump. warm-cache.yml must build with this job's
      # exact destination and flags, or the restored products are treated as stale.
      - name: Restore DerivedData cache
        uses: actions/cache/restore@v4
        with:
          path: build
          key: deriveddata-${{ runner.os }}-xcode26.5-pinned-mtimes-${{ hashFiles('Kioku.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            deriveddata-${{ runner.os }}-xcode26.5-pinned-mtimes-
            deriveddata-${{ runner.os }}-xcode26.5-

      # The dictionary sqlite is downloaded from the GitHub Release pinned in
      # DictionaryDownloadManager.swift (not committed — the raw file, ~365 MB,
      # is gitignored).
      - name: Download dictionary.sqlite
        run: bash scripts/ensure_dictionary.sh

      # The handwriting model is committed as a zstd archive (~14 MB) and
      # decompressed on demand; the raw file (~25 MB) is gitignored. Without
      # this the Copy Bundle Resources phase fails (CpResource handwriting-ja.model).
      - name: Decompress handwriting-ja.model
        run: bash scripts/ensure_handwriting_model.sh

      # Parallel testing (Xcode's default for simulator destinations) spins up multiple
      # simulator "clones" that run test classes concurrently on the runner's finite cores.
      # The heaviest tests (LexiconTests, SegmenterIntegrationTests, InflectionFormNamesTests)
      # each trigger TestReadResources.shared()'s full SQLite scan + 327k-record trie build on
      # first use — when multiple clones do that simultaneously they starve each other badly
      # enough to blow past normal execution time (one observed run: a single test took 126s
      # instead of its usual <1s) and fail outright. Serial execution (matching how on-device
      # runs against Monoceros always behave — no clones there) doesn't hit this; disabling it
      # trades CI wall-clock time for determinism.
      #
      # AlignmentQualityTests is excluded outright: each fixture runs the full aligner on real
      # audio (30-90 s each) and is meant for the device — see the test file's own header, which
      # also records that CI-env-var-based skipping doesn't propagate into the simulator test
      # process, so a build-flag exclusion is the mechanism.
      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Kioku.xcodeproj \
            -scheme Kioku \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -parallel-testing-enabled NO \
            -skip-testing:KiokuTests/AlignmentQualityTests \
            -enableCodeCoverage YES \
            -derivedDataPath build \
            -resultBundlePath build/Kioku.xcresult \
            CODE_SIGNING_ALLOWED=NO

      # Emit a per-target line-coverage summary into the workflow run page so
      # PR reviewers see coverage without downloading the artifact. xccov reads
      # the same xcresult the artifact step uploads — single source of truth.
      - name: Coverage summary
        if: always()
        run: |
          if [[ ! -d build/Kioku.xcresult ]]; then
            echo "No xcresult — skipping coverage summary." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # A cancelled or crashed test step leaves an incomplete bundle xccov can't open; note it
          # and move on rather than failing this informational step on a traceback.
          if ! xcrun xccov view --report --json build/Kioku.xcresult > /tmp/coverage.json 2>/dev/null; then
            echo "Coverage unavailable — the result bundle is incomplete (tests didn't finish)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Coverage"
            echo
            echo "| Target | Lines covered | Executable lines | % |"
            echo "|---|---:|---:|---:|"
            python3 -c '
          import json, sys
          report = json.load(sys.stdin)
          targets = report.get("targets", [])
          saw_executable = False
          for target in targets:
              name = target.get("name", "?")
              covered = target.get("coveredLines", 0)
              executable = target.get("executableLines", 0)
              if executable > 0:
                  saw_executable = True
              pct = "—" if executable == 0 else f"{(covered / executable * 100):.1f}%"
              print(f"| {name} | {covered} | {executable} | {pct} |")
          # Guard: a changed xccov JSON shape (renamed keys / restructured report) would leave
          # every row at 0/0 and read as real 0% coverage. Surface it loudly instead.
          if not targets:
              print("")
              print("> ⚠️ **Coverage parsing found no targets** — the `xccov --report --json` shape "
                    "may have changed (check `report[\"targets\"]`).")
          elif not saw_executable:
              print("")
              print("> ⚠️ **No executable lines across any target** — likely a changed xccov JSON "
                    "shape (`coveredLines`/`executableLines` keys), not genuinely zero coverage.")
          ' < /tmp/coverage.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload xcresult bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kioku-xcresult
          path: build/Kioku.xcresult
          if-no-files-found: ignore
          retention-days: 7
