name: Tests

# Pull requests only: a run on the push to main would re-test a tree that was tested minutes
# earlier. warm-cache.yml builds on main (dependency changes only) so these runs start warm.
# workflow_dispatch is there for the rare manual run against main.
on:
  pull_request:
  workflow_dispatch:

# A newer push to the same PR makes the older run pointless, so cancel the superseded one.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    # macos-26 (preview) ships iOS 26.5 simulator runtimes; macos-15 caps at
    # iOS 26.2, where ~18 of our tests SIGABRT during process bootstrap.
    # Locally on iOS 26.5 (where developers run) those same tests pass cleanly,
    # so matching CI to the local runtime eliminates the cluster of
    # environmental crashes without skip-listing real test coverage.
    runs-on: macos-26
    # A run past 30 minutes is a hang, not a slow build.
    timeout-minutes: 30
    steps:
      # Submodules now use public HTTPS URLs directly (.gitmodules), so no deploy key
      # is needed. This SSH→HTTPS rewrite is a harmless safety net for any stray SSH URL
      # (e.g. a locally-inited checkout). If the SwiftWhisper fork is ever made private,
      # a PAT with repo scope must be provisioned here — GITHUB_TOKEN can't read another repo.
      - name: Rewrite any SSH submodule URLs to HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      # The restored DerivedData can only be reused if unchanged sources look unchanged to the
      # build system. A checkout gives every file a new mtime and inode, which on its own made the
      # PR run recompile all of Kioku plus the local packages (SwiftWhisper, zinnia-swift,
      # SwiftWhisperAlign). The script stamps each tracked file with an mtime derived from its
      # content hash, and the default makes XCBuild ignore inode/device changes. warm-cache.yml
      # and tests.yml must both do this, so the stamps match.
      - name: Pin source mtimes
        run: |
          python3 scripts/ci_pin_source_mtimes.py .
          defaults write com.apple.dt.XCBuild IgnoreFileSystemDeviceInodeChanges -bool YES

      # The project targets iOS 26.2 / Xcode 26+. The runner image carries
      # several Xcode versions side-by-side; pick the newest stable so the
      # symbol SVG asset compiler matches the source format.
      - name: Show installed Xcode versions
        run: ls /Applications | grep -i '^Xcode' || true

      # Pin to 26.5 rather than latest-stable: on macos-26, latest-stable
      # resolves to Xcode 26.6 RC, which ships the Metal compiler as a
      # separately-downloadable component the image doesn't preinstall — so the
      # mlx-swift dependency's .metal shaders fail to compile ("missing Metal
      # Toolchain"). 26.5 has Metal preinstalled. The download step below is a
      # belt-and-suspenders net if a future image drops the preinstalled tool.
      - name: Select Xcode 26.5
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      # Ensure the Metal Toolchain is present so mlx-swift's .metal shaders
      # compile. No-op on Xcode versions that bundle it; downloads it otherwise.
      - name: Ensure Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain || true

      - name: List available iOS simulators
        run: xcrun simctl list devices available | grep -E 'iPhone (15|16|17)' | head -10

      # Boot the simulator the Build & test destination resolves to (iPhone 17, newest iOS) now,
      # so it boots while the dependencies download and the build runs. In run 35956854815,
      # about 2.7 minutes passed between the end of the build and the first test starting,
      # mostly spent booting and installing on the simulator.
      - name: Pre-boot simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          candidates = []
          for runtime, entries in devices.items():
              match = re.search(r"iOS-(\d+)-(\d+)", runtime)
              if not match:
                  continue
              for device in entries:
                  if device["name"] == "iPhone 17":
                      candidates.append(((int(match[1]), int(match[2])), device["udid"]))
          print(max(candidates)[1] if candidates else "")
          ')
          if [[ -z "$udid" ]]; then
            echo "No iPhone 17 simulator found; xcodebuild will boot one itself."
            exit 0
          fi
          echo "Booting $udid"
          xcrun simctl boot "$udid" || true

      # Restores the DerivedData (resolved package checkouts + already-compiled package products)
      # that warm-cache.yml saves from main, so a PR only compiles what it changed instead of the
      # whole SwiftPM graph (MLX, swift-nio, HuggingFace, whisper.cpp, …) — ~10 of a cold run's
      # ~14 minutes. Restore-only: a cache saved from a PR ref is readable by that PR alone, so
      # saving here just piled up ~1.1 GB per PR that no other run could use. The key is the
      # Package.resolved hash, the same key warm-cache.yml writes; restore-keys falls back to the
      # newest older cache after a dependency bump. warm-cache.yml must build with this job's
      # exact destination and flags, or the restored products are treated as stale.
      - name: Restore DerivedData cache
        uses: actions/cache/restore@v4
        with:
          path: build
          key: deriveddata-${{ runner.os }}-xcode26.5-pinned-mtimes-${{ hashFiles('Kioku.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            deriveddata-${{ runner.os }}-xcode26.5-pinned-mtimes-
            deriveddata-${{ runner.os }}-xcode26.5-

      # The dictionary sqlite is downloaded from the GitHub Release pinned in
      # DictionaryDownloadManager.swift (not committed — the raw file, ~365 MB,
      # is gitignored).
      - name: Download dictionary.sqlite
        run: bash scripts/ensure_dictionary.sh

      # The handwriting model is committed as a zstd archive (~14 MB) and
      # decompressed on demand; the raw file (~25 MB) is gitignored. Without
      # this the Copy Bundle Resources phase fails (CpResource handwriting-ja.model).
      - name: Decompress handwriting-ja.model
        run: bash scripts/ensure_handwriting_model.sh

      # Parallel testing (Xcode's default for simulator destinations) spins up multiple
      # simulator "clones" that run test classes concurrently on the runner's finite cores.
      # The heaviest tests (LexiconTests, SegmenterIntegrationTests, InflectionFormNamesTests)
      # each trigger TestReadResources.shared()'s full SQLite scan + 327k-record trie build on
      # first use — when multiple clones do that simultaneously they starve each other badly
      # enough to blow past normal execution time (one observed run: a single test took 126s
      # instead of its usual <1s) and fail outright. Serial execution (matching how on-device
      # runs against Monoceros always behave — no clones there) doesn't hit this; disabling it
      # trades CI wall-clock time for determinism.
      #
      # AlignmentQualityTests is excluded outright, not just serialized: it runs real on-device
      # Whisper/CTC-forced-alignment compute via MLX/Metal against real audio fixtures (30-90s
      # each, by design — see the test file's own header). On this runner it crashes during MLX's
      # Metal device initialization (libc++ hardening assertion inside
      # mlx::core::metal::Device::Device()), which reads as this runner's simulator lacking a
      # functional Metal/GPU backend for MLX — not something fixable from the test/app side. The
      # test file's own header already recommends this exact -skip-testing flag "to skip quality
      # tests during a fast iteration cycle" and separately documents that CI-env-var-based
      # skipping was already tried and found unreliable (doesn't propagate into the simulator
      # test process), so a build-flag exclusion here is the intended mechanism, not a workaround.
      #
      # -skipPackagePluginValidation: mlx-swift's Package.swift declares a "CudaBuild" build-tool
      # plugin (for its optional CUDA/Linux backend, irrelevant to this iOS build) that Xcode
      # otherwise refuses to run non-interactively with "Plugin \"CudaBuild\" from package
      # \"mlx-swift\" must be enabled before it can be used" — there's no CI-safe way to grant that
      # trust ahead of time (it's normally an Xcode GUI prompt), so this flag skips the trust
      # check entirely. Scoped to this one invocation rather than a machine-wide
      # `defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidation` so it only
      # affects this job, not every Xcode invocation on the runner.
      #
      # Only applied for trusted triggers (a push, or a pull_request whose head lives in this
      # same repo) — never for a pull_request from a fork. A fork PR could otherwise redirect the
      # package graph to a malicious build-tool plugin and have it execute on the runner, with
      # access to the job's environment, before any human reviews the diff. A fork PR's `ios`
      # check stays red on the CudaBuild error permanently — re-running the same job does NOT
      # help, since head.repo.full_name is fixed by the original event. Recovering requires a
      # maintainer-controlled path outside this condition (e.g. pushing the reviewed diff to a
      # same-repo branch, or a trusted-label/workflow_dispatch gate) — not implemented here. A
      # permanently-red fork-PR check is the deliberate fail-safe, not a bug.
      - name: Build & test
        env:
          TRUST_PACKAGE_PLUGINS: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -o pipefail
          plugin_flag=()
          if [[ "$TRUST_PACKAGE_PLUGINS" == "true" ]]; then
            plugin_flag=(-skipPackagePluginValidation)
          fi
          xcodebuild test \
            -project Kioku.xcodeproj \
            -scheme Kioku \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -parallel-testing-enabled NO \
            -skip-testing:KiokuTests/AlignmentQualityTests \
            -enableCodeCoverage YES \
            -derivedDataPath build \
            -resultBundlePath build/Kioku.xcresult \
            "${plugin_flag[@]}" \
            CODE_SIGNING_ALLOWED=NO

      # Emit a per-target line-coverage summary into the workflow run page so
      # PR reviewers see coverage without downloading the artifact. xccov reads
      # the same xcresult the artifact step uploads — single source of truth.
      - name: Coverage summary
        if: always()
        run: |
          if [[ ! -d build/Kioku.xcresult ]]; then
            echo "No xcresult — skipping coverage summary." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # A cancelled or crashed test step leaves an incomplete bundle xccov can't open; note it
          # and move on rather than failing this informational step on a traceback.
          if ! xcrun xccov view --report --json build/Kioku.xcresult > /tmp/coverage.json 2>/dev/null; then
            echo "Coverage unavailable — the result bundle is incomplete (tests didn't finish)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Coverage"
            echo
            echo "| Target | Lines covered | Executable lines | % |"
            echo "|---|---:|---:|---:|"
            python3 -c '
          import json, sys
          report = json.load(sys.stdin)
          targets = report.get("targets", [])
          saw_executable = False
          for target in targets:
              name = target.get("name", "?")
              covered = target.get("coveredLines", 0)
              executable = target.get("executableLines", 0)
              if executable > 0:
                  saw_executable = True
              pct = "—" if executable == 0 else f"{(covered / executable * 100):.1f}%"
              print(f"| {name} | {covered} | {executable} | {pct} |")
          # Guard: a changed xccov JSON shape (renamed keys / restructured report) would leave
          # every row at 0/0 and read as real 0% coverage. Surface it loudly instead.
          if not targets:
              print("")
              print("> ⚠️ **Coverage parsing found no targets** — the `xccov --report --json` shape "
                    "may have changed (check `report[\"targets\"]`).")
          elif not saw_executable:
              print("")
              print("> ⚠️ **No executable lines across any target** — likely a changed xccov JSON "
                    "shape (`coveredLines`/`executableLines` keys), not genuinely zero coverage.")
          ' < /tmp/coverage.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload xcresult bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kioku-xcresult
          path: build/Kioku.xcresult
          if-no-files-found: ignore
          retention-days: 7
